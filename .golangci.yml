version: "2"
run:
  concurrency: 16
linters:
  default: all
  disable:
    - wsl
    - wsl_v5
    - dupl
    - containedctx
    - cyclop
    - exhaustruct
    - funlen
    - gochecknoglobals
    - gosmopolitan
    - ireturn
    - lll
    - mnd
    - nonamedreturns
    - tagalign
    - varnamelen
  settings:
    tagliatelle:
      case:
        rules:
          json: snake
    depguard:
      rules:
        config:
          list-mode: lax
          files:
            - "**/internal/config/**"
          deny:
            - pkg: "github.com/djalben/istok-agent-core"
        domain:
          list-mode: lax
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: "github.com/djalben/istok-agent-core/internal"
        ports:
          list-mode: lax
          files:
            - "**/internal/ports/**"
          deny:
            - pkg: "github.com/djalben/istok-agent-core/internal/application"
            - pkg: "github.com/djalben/istok-agent-core/internal/infrastructure"
            - pkg: "github.com/djalben/istok-agent-core/internal/transport"
        application:
          list-mode: lax
          files:
            - "**/internal/application/**"
          deny:
            - pkg: "github.com/djalben/istok-agent-core/internal/infrastructure"
            - pkg: "github.com/djalben/istok-agent-core/internal/transport"
            - pkg: "github.com/djalben/istok-agent-core/internal/config"
        infrastructure:
          list-mode: lax
          files:
            - "**/internal/infrastructure/**"
          deny:
            - pkg: "github.com/djalben/istok-agent-core/internal/application"
            - pkg: "github.com/djalben/istok-agent-core/internal/transport"
        transport:
          list-mode: lax
          files:
            - "**/internal/transport/**"
          deny:
            - pkg: "github.com/djalben/istok-agent-core/internal/config"
            - pkg: "github.com/djalben/istok-agent-core/internal/infrastructure"
    staticcheck:
      checks:
        - all
    # no-global: default — запрет slog.Info без logger; context: all — только *Context.
    sloglint:
      static-msg: true
      key-naming-case: camel
      context: all
      no-global: default
      forbidden-keys:
        - time
        - level
        - msg
        - source
# Общие исключения
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
